[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainer"
version = "0.0.1"
description = "Systeme d'entrainement"
dependencies = ["PyYAML"]

[project.scripts]
trainer = "trainer:main"

[tool.setuptools]
py-modules = ["trainer", "arg", "importBase"]

[tool.setuptools.package-dir]
"" = "src"