name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: pypi-publish
  cancel-in-progress: false  # Never cancel an in-flight publish

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les outils de build
        run: pip install build twine

      - name: Builder le package
        run: python -m build

      - name: Vérifier les métadonnées du package
        run: twine check dist/*

      - name: Sauvegarder les artefacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Récupérer les artefacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publier sur PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62a99e3ab34e3f9d1c9a1a0f26  # release/v1 @ 2025-04
        with:
          attestations: true